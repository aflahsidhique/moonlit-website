services:
  # Backend API — NestJS-style Express app in server/, talks to the Aiven
  # Postgres instance via DATABASE_URL. Runs pending migrations + the
  # idempotent seed script on every deploy.
  - name: moonlit-website-api
    type: web
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Moonlit Admin
      - key: CORS_ORIGINS
        value: https://moonlit-website.onrender.com
      - key: PORTAL_URL
        value: https://moonlit-website.onrender.com/portal
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SMSGATE_BASE_URL
        value: https://api.sms-gate.app/3rdparty/v1
      - key: SMSGATE_USERNAME
        sync: false
      - key: SMSGATE_PASSWORD
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  # Public site + admin panel + volunteer portal — React/Vite SPA (client/).
  # lib/api.js auto-detects this domain and points at moonlit-website-api.
  - name: moonlit-website
    type: web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
