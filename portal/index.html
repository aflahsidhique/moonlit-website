<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer Portal Login — Moonlit Foundation</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/custom.css">
<link rel="stylesheet" href="/portal/assets/portal.css">
</head>
<body class="min-h-screen flex items-center justify-center px-4" style="background:linear-gradient(115deg,var(--mf-navy) 0%,var(--mf-navy-2) 55%,#183a7e 100%)">

  <div class="mf-form-card w-full max-w-sm">
    <div class="flex items-center gap-3 mb-6">
      <span class="w-11 h-11 rounded-full border-2 border-[#14338C] flex items-center justify-center relative flex-shrink-0">
        <i class="fa-solid fa-fire-flame-curved text-[#14338C] text-lg"></i>
      </span>
      <span class="leading-tight">
        <span class="block font-bold text-[#0A1F44] tracking-wide">MOONLIT</span>
        <span class="block text-[9px] tracking-[.35em] text-[#4B5563]">VOLUNTEER PORTAL</span>
      </span>
    </div>
    <h1 class="text-xl mb-1">Volunteer Login</h1>
    <p class="text-[13px] text-[#4B5563] mb-6">Sign in with the Volunteer ID and password from your approval email/SMS.</p>

    <form id="mfPortalLoginForm">
      <div class="mb-4">
        <label class="mf-label" for="l-vid">Volunteer ID</label>
        <input class="mf-input" id="l-vid" required placeholder="MLF202500001" autocomplete="username">
      </div>
      <div class="mb-2">
        <label class="mf-label" for="l-password">Password</label>
        <input class="mf-input" id="l-password" type="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <p id="mfPortalLoginError" class="mf-error-msg mb-2" style="display:none"></p>
      <button class="mf-btn mf-btn-primary w-full justify-center mt-4" type="submit">Log In <i class="fa-solid fa-arrow-right"></i></button>
    </form>
    <p class="text-[13px] mt-4"><a href="/portal/forgot-password.html" class="text-[#14338C] underline">Forgot your password?</a></p>
    <p class="text-[12px] text-[#9CA3AF] mt-5">Not approved yet? Credentials are issued automatically once your <a href="/get-involved.html#volunteer" class="text-[#14338C] underline">volunteer registration</a> is reviewed.</p>
  </div>

  <script src="/assets/config.js"></script>
  <script src="/portal/assets/portal.js"></script>
</body>
</html>
