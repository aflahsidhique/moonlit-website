<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Moonlit Foundation</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/custom.css">
<link rel="stylesheet" href="/portal/assets/portal.css">
</head>
<body class="min-h-screen flex items-center justify-center px-4" style="background:linear-gradient(115deg,var(--mf-navy) 0%,var(--mf-navy-2) 55%,#183a7e 100%)">

  <div class="mf-form-card w-full max-w-sm">
    <div class="flex items-center gap-3 mb-6">
      <span class="w-11 h-11 rounded-full border-2 border-[#14338C] flex items-center justify-center relative flex-shrink-0">
        <i class="fa-solid fa-fire-flame-curved text-[#14338C] text-lg"></i>
      </span>
      <span class="leading-tight">
        <span class="block font-bold text-[#0A1F44] tracking-wide">MOONLIT</span>
        <span class="block text-[9px] tracking-[.35em] text-[#4B5563]">VOLUNTEER PORTAL</span>
      </span>
    </div>
    <h1 class="text-xl mb-1">Reset Password</h1>
    <p class="text-[13px] text-[#4B5563] mb-6" id="mfResetSub">Choose a new password for your volunteer account.</p>

    <form id="mfResetForm">
      <div class="mb-4">
        <label class="mf-label" for="r-password">New Password</label>
        <input class="mf-input" id="r-password" type="password" required minlength="8" placeholder="At least 8 characters" autocomplete="new-password">
      </div>
      <div class="mb-2">
        <label class="mf-label" for="r-confirm">Confirm New Password</label>
        <input class="mf-input" id="r-confirm" type="password" required minlength="8" placeholder="Re-enter password" autocomplete="new-password">
      </div>
      <p id="mfResetError" class="mf-error-msg mb-2" style="display:none"></p>
      <button class="mf-btn mf-btn-primary w-full justify-center mt-4" type="submit">Reset Password <i class="fa-solid fa-check"></i></button>
    </form>
    <p class="text-[13px] mt-5"><a href="/portal/index.html" class="text-[#14338C] underline"><i class="fa-solid fa-arrow-left mr-1"></i>Back to login</a></p>
  </div>

  <script src="/assets/config.js"></script>
  <script>
    (function () {
      var API = window.MF_API_BASE || "http://localhost:4000/api";
      var form = document.getElementById("mfResetForm");
      var errorEl = document.getElementById("mfResetError");
      var sub = document.getElementById("mfResetSub");

      var token = new URLSearchParams(window.location.search).get("token");
      if (!token) {
        form.style.display = "none";
        sub.textContent = "This reset link is missing its token — request a new one from the login page.";
        return;
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        errorEl.style.display = "none";
        var password = document.getElementById("r-password").value;
        var confirm = document.getElementById("r-confirm").value;

        if (password.length < 8) {
          errorEl.textContent = "Password must be at least 8 characters.";
          errorEl.style.display = "block";
          return;
        }
        if (password !== confirm) {
          errorEl.textContent = "Passwords don't match.";
          errorEl.style.display = "block";
          return;
        }

        var btn = form.querySelector("button[type=submit]");
        var original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = "Resetting…";

        fetch(API + "/volunteer-auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, newPassword: password })
        })
          .then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (body) {
              if (!res.ok) throw new Error(body.error || "Something went wrong. Please try again.");
              form.style.display = "none";
              sub.innerHTML = '<span style="color:#065F46">' + body.message + '</span> — <a href="/portal/index.html" class="text-[#14338C] underline">Log in now</a>';
            });
          })
          .catch(function (err) {
            errorEl.textContent = err.message;
            errorEl.style.display = "block";
          })
          .finally(function () {
            btn.disabled = false;
            btn.innerHTML = original;
          });
      });
    })();
  </script>
</body>
</html>
