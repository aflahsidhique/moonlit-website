<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Moonlit Foundation</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/custom.css">
<link rel="stylesheet" href="/portal/assets/portal.css">
</head>
<body class="min-h-screen flex items-center justify-center px-4" style="background:linear-gradient(115deg,var(--mf-navy) 0%,var(--mf-navy-2) 55%,#183a7e 100%)">

  <div class="mf-form-card w-full max-w-sm">
    <div class="flex items-center gap-3 mb-6">
      <span class="w-11 h-11 rounded-full border-2 border-[#14338C] flex items-center justify-center relative flex-shrink-0">
        <i class="fa-solid fa-fire-flame-curved text-[#14338C] text-lg"></i>
      </span>
      <span class="leading-tight">
        <span class="block font-bold text-[#0A1F44] tracking-wide">MOONLIT</span>
        <span class="block text-[9px] tracking-[.35em] text-[#4B5563]">VOLUNTEER PORTAL</span>
      </span>
    </div>
    <h1 class="text-xl mb-1">Forgot Password</h1>
    <p class="text-[13px] text-[#4B5563] mb-6">Enter your Volunteer ID and we'll email a reset link to the address on file.</p>

    <form id="mfForgotForm">
      <div class="mb-4">
        <label class="mf-label" for="f-vid">Volunteer ID</label>
        <input class="mf-input" id="f-vid" required placeholder="MLF202500001" autocomplete="username">
      </div>
      <p id="mfForgotError" class="mf-error-msg mb-2" style="display:none"></p>
      <p id="mfForgotSuccess" class="text-[13px] mb-2" style="display:none;color:#065F46"></p>
      <button class="mf-btn mf-btn-primary w-full justify-center mt-2" type="submit">Send Reset Link <i class="fa-solid fa-paper-plane"></i></button>
    </form>
    <p class="text-[13px] mt-5"><a href="/portal/index.html" class="text-[#14338C] underline"><i class="fa-solid fa-arrow-left mr-1"></i>Back to login</a></p>
  </div>

  <script src="/assets/config.js"></script>
  <script>
    (function () {
      var API = window.MF_API_BASE || "http://localhost:4000/api";
      var form = document.getElementById("mfForgotForm");
      var errorEl = document.getElementById("mfForgotError");
      var successEl = document.getElementById("mfForgotSuccess");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        errorEl.style.display = "none";
        successEl.style.display = "none";
        var volunteerId = document.getElementById("f-vid").value.trim();
        var btn = form.querySelector("button[type=submit]");
        var original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = "Sending…";

        fetch(API + "/volunteer-auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ volunteerId: volunteerId })
        })
          .then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (body) {
              if (!res.ok) throw new Error(body.error || "Something went wrong. Please try again.");
              successEl.textContent = body.message;
              successEl.style.display = "block";
              form.reset();
            });
          })
          .catch(function (err) {
            errorEl.textContent = err.message;
            errorEl.style.display = "block";
          })
          .finally(function () {
            btn.disabled = false;
            btn.innerHTML = original;
          });
      });
    })();
  </script>
</body>
</html>
