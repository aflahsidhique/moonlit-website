<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Moonlit Foundation</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="shortcut icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/custom.css">
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="min-h-screen flex items-center justify-center px-4" style="background:linear-gradient(115deg,var(--mf-navy) 0%,var(--mf-navy-2) 55%,#183a7e 100%)">

  <div class="mf-form-card w-full max-w-sm">
    <div class="flex items-center gap-3 mb-6">
      <span class="w-11 h-11 rounded-full border-2 border-[#14338C] flex items-center justify-center relative flex-shrink-0">
        <i class="fa-solid fa-fire-flame-curved text-[#14338C] text-lg"></i>
      </span>
      <span class="leading-tight">
        <span class="block font-bold text-[#0A1F44] tracking-wide">MOONLIT</span>
        <span class="block text-[9px] tracking-[.35em] text-[#4B5563]">ADMIN PANEL</span>
      </span>
    </div>
    <h1 class="text-xl mb-1">Admin Login</h1>
    <p class="text-[13px] text-[#4B5563] mb-6">Sign in to review volunteers, blood requests, messages and manage events.</p>

    <form id="mfLoginForm">
      <div class="mb-4">
        <label class="mf-label" for="l-email">Email</label>
        <input class="mf-input" id="l-email" type="email" required placeholder="admin@moonlitfoundation.org" autocomplete="username">
      </div>
      <div class="mb-2">
        <label class="mf-label" for="l-password">Password</label>
        <input class="mf-input" id="l-password" type="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <p id="mfLoginError" class="mf-error-msg mb-2" style="display:none"></p>
      <button class="mf-btn mf-btn-primary w-full justify-center mt-4" type="submit">Log In <i class="fa-solid fa-arrow-right"></i></button>
    </form>
  </div>

  <script src="/assets/config.js"></script>
  <script src="/admin/assets/admin.js"></script>
</body>
</html>
